const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100); camera.position.set(10,7.1,13.8);

function mesh(g,m,parent=scene){const o=new THREE.Mesh(g,m);parent.add(o);return o}function box(w,h,d,m,x,y,z,parent=scene){const o=mesh(new THREE.BoxGeometry(w,h,d),m,parent);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o}function sphere(parent,m,x,y,z,sx,sy,sz,detail=2){const o=mesh(new THREE.IcosahedronGeometry(1,detail),m,parent);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;return o}function cyl(parent,m,r1,r2,h,x,y,z,segments=16){const o=mesh(new THREE.CylinderGeometry(r1,r2,h,segments),m,parent);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o}function line(points,material,parent=scene){const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));const l=new THREE.Line(g,material);parent.add(l);return l}function tube(points,r,material,parent=scene,segments=24){const c=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));const o=mesh(new THREE.TubeGeometry(c,segments,r,6,false),material,parent);return o}
const rand=(a,b)=>a+Math.random()*(b-a); const waterY=4.55;let time=0, paused=false;
function ground(x,z){return .18+.045*(z+2)+.018*Math.sin(x*2+z*3)}

box(8.45,.35,4.45,dark,0,-.18,0);box(8.25,.17,4.25,rimMat,0,.05,0);box(7.85,.45,3.9,mat(0x0c1718,.75),0,-.55,0);box(8.6,.12,4.6,mat(0x182522,.65),0,-.82,0);

function createCastle(){const g=new THREE.Group();g.name='Weathered stone castle';g.position.set(-.25,.22,-1.05);scene.add(g);box(2.5,.18,.85,mortar,0,.02,0,g);const wall=box(1.6,1.35,.5,stone,0,.75,0,g);wall.visible=false;

// Sponge filter, airline and outlet.

// Curved leaf geometry. Each leaf has a fixed base and a deformable tip.
const animatedLeaves=[];
function leaf(parent,opts){const {length,width,color,angle=0,lean=0,phase=0,stiff=1,kind='leaf'}=opts;const rows=14,cols=4,verts=[],indices=[],base=[];for(let i=0;i<=rows;i++){const t=i/rows;for(let j=0;j<=cols;j++){const u=j/cols*2-1;let shape=kind==='ribbon'?(0.8+.2*Math.sin(Math.PI*t))*(1-t*.72):Math.pow(Math.sin(Math.PI*t),.7);const x=u*width*shape*.5;const y=length*t;const z=lean*t*t+.045*u*u*Math.sin(Math.PI*t);verts.push(x,y,z);base.push(x,y,z);if(i<rows&&j<cols){let k=i*(cols+1)+j;indices.push(k,k+cols+1,k+1,k+1,k+cols+1,k+cols+2)}}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();const material=new THREE.MeshStandardMaterial({color,roughness:.55,side:THREE.DoubleSide,transparent:true,opacity:.94});const o=mesh(geo,material,parent);o.rotation.y=angle;o.castShadow=true;animatedLeaves.push({o,base,rows,cols,phase,stiff,length});const vein=line([[0,.05,.012],[0,length*.5,lean*.25+.015],[0,length*.94,lean*.88+.015]],new THREE.LineBasicMaterial({color:0x91b475,transparent:true,opacity:.35}),o);return o}
function createVallisneria(){const g=new THREE.Group();g.name='Vallisneria';g.position.set(-3.15,ground(-3.15,-1.25),-1.25);scene.add(g);for(let i=0;i<10;i++){const a=i*Math.PI*2/10;const l=leaf(g,{length:rand(2.6,3.8),width:rand(.12,.19),color:i%2?0x428a48:0x79ad55,angle:a,lean:rand(.25,.75),phase:i,stiff:.55,kind:'ribbon'});l.position.set(Math.cos(a)*.1,0,Math.sin(a)*.1)}return g}
function createAnubias(){const g=new THREE.Group();g.name='Anubias';g.position.set(-2.5,ground(-2.5,.1),.1);scene.add(g);tube([[-.3,.07,0],[0,.1,0],[.3,.08,.08]],.055,greenDark,g);for(let i=0;i<7;i++){let a=i*Math.PI*2/7,h=rand(.3,.5);tube([[0,.08,0],[Math.cos(a)*.22,h*.65,Math.sin(a)*.22],[Math.cos(a)*.32,h,Math.sin(a)*.32]],.018,greenDark,g,8);let pivot=new THREE.Group();pivot.position.set(Math.cos(a)*.3,h,Math.sin(a)*.3);pivot.rotation.z=-.7;pivot.rotation.y=a;g.add(pivot);leaf(pivot,{length:.55,width:.29,color:i%2?0x275c37:0x326d41,lean:.12,phase:i,stiff:.12})}return g}
function createJavaFern(){const g=new THREE.Group();g.name='Java fern';g.position.set(1.65,ground(1.65,-1.48),-1.48);scene.add(g);for(let i=0;i<9;i++){let a=i*Math.PI*2/9;const pivot=new THREE.Group();pivot.rotation.y=a;pivot.rotation.z=rand(-.35,.35);g.add(pivot);leaf(pivot,{length:rand(1.25,1.9),width:rand(.16,.27),color:i%2?0x5a8248:0x47794c,lean:rand(.2,.5),phase:i,stiff:.35})}return g}

// Fish meshes use different proportions, markings and flexible fin surfaces.
function fishBody(g,kind,scales){const geo=new THREE.SphereGeometry(1,32,20);geo.scale(...scales);const base={guppy:0x83b6bb,clown:0xf07828,angel:0xcbd6ce,betta:0x2654a3}[kind];const m=mat(base,.35,.16);if(kind==='clown'||kind==='angel'){m.onBeforeCompile=shader=>{shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vFishPos;').replace('#include <begin_vertex>','#include <begin_vertex>\nvFishPos = position;');shader.fragmentShader=shader.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vFishPos;').replace('#include <color_fragment>',`#include <color_fragment>\nfloat px=vFishPos.x; ${kind==='clown'?'float s=min(min(abs(px+0.26),abs(px+0.02)),abs(px-0.25)); float wobble=0.012*sin(vFishPos.y*15.0); if(s<0.075+wobble) diffuseColor.rgb*=vec3(0.08,0.075,0.07); if(s<0.052+wobble) diffuseColor.rgb=vec3(0.95,0.95,0.87);':'float s=min(min(abs(px+0.22),abs(px+0.02)),abs(px-0.19)); if(s<0.035+0.01*sin(vFishPos.y*9.0)) diffuseColor.rgb*=0.17;'}`)};}const b=mesh(geo,m,g);b.castShadow=true;return b}

const pectorals=[];

function createClownfish(){const g=new THREE.Group();g.name='Clownfish';fishBody(g,'clown',[.43,.25,.15]);fin(g,{x:-.36,length:.27,height:.23,color:0xf28b35,edge:0x281f1b,fan:true,phase:2});fin(g,{x:.17,y:.20,length:.5,height:.16,color:0xf29539,edge:0x302925});fin(g,{x:.08,y:-.2,length:.4,height:.1,color:0xf28a30,edge:0x39281e});facial(g,.31,.25,.15,.045);return g}
function createAngelfish(){const g=new THREE.Group();g.name='Freshwater angelfish';fishBody(g,'angel',[.36,.43,.095]);fin(g,{x:.16,y:.32,length:.55,height:.43,color:0xc5d1c2,edge:0x526768});fin(g,{x:.13,y:-.33,length:.52,height:.38,color:0xb8cbc4,edge:0x526768});fin(g,{x:-.32,length:.25,height:.22,color:0x9bafa9,edge:0x415459,fan:true});facial(g,.28,.38,.095,.042);for(let z of [-.055,.055])tube([[.16,-.31,z],[.1,-.65,z],[-.02,-1.05,z]],.008,mat(0xc5d5c6,.4),g,16);return g}
function createBetta(){const g=new THREE.Group();g.name='Betta';fishBody(g,'betta',[.39,.16,.12]);sphere(g,mat(0x2c929e,.3,.25),.22,.02,0,.18,.14,.12);fin(g,{x:-.3,length:.55,height:.38,color:0x2868ad,edge:0xa63983,fan:true,phase:3});fin(g,{x:.13,y:.14,length:.57,height:.27,color:0x327ac0,edge:0xa03d8a,phase:4});fin(g,{x:.2,y:-.14,length:.62,height:.28,color:0x2c66b4,edge:0xa83878,phase:5});facial(g,.3,.16,.12,.038);return g}
const fish=[createGuppy(),createClownfish(),createAngelfish(),createBetta()];const fishStates=fish.map((g,i)=>{scene.add(g);g.position.set([-2.1,.2,1.6,-.8][i],[3.45,2.3,3,1.65][i],[.25,.5,.1,1][i]);return {g,i,phase:i*2,target:new THREE.Vector3(),vel:new THREE.Vector3(.2,0,.03),speed:[.46,.34,.25,.24][i],timer:0}});

const bubbles=[];const bubbleMat=new THREE.MeshPhysicalMaterial({color:0xc8f5ef,roughness:.08,metalness:.05,transmission:.8,thickness:.1,ior:1.333,transparent:true,opacity:.55,depthWrite:false});const bubbleGeo=new THREE.SphereGeometry(1,10,8);for(let i=0;i<100;i++){let o=mesh(bubbleGeo,bubbleMat);o.visible=false;bubbles.push({o,active:false})}let emit=0;const ripples=[];const rippleMat=new THREE.MeshBasicMaterial({color:0xc8f5ed,transparent:true,opacity:.35,side:THREE.DoubleSide,depthWrite:false});for(let i=0;i<12;i++){let o=mesh(new THREE.RingGeometry(.95,1,48),rippleMat.clone());o.rotation.x=-Math.PI/2;o.visible=false;ripples.push({o,age:10})}let rippleIndex=0;
// Water surface samples a dedicated scene-color pass, offset by its animated normal.
const waterGeo=new THREE.PlaneGeometry(7.88,3.88,90,48);waterGeo.rotateX(-Math.PI/2);const waterBase=waterGeo.attributes.position.array.slice();const target=new THREE.WebGLRenderTarget(1,1,{depthBuffer:true});target.texture.colorSpace=THREE.SRGBColorSpace;
const waterMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{sceneTex:{value:target.texture},resolution:{value:new THREE.Vector2(1,1)},time:{value:0}},vertexShader:`varying vec3 vWorld; varying vec3 vNormalW; void main(){ vec4 w=modelMatrix*vec4(position,1.);vWorld=w.xyz;vNormalW=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform sampler2D sceneTex;uniform vec2 resolution;uniform float time;varying vec3 vWorld;varying vec3 vNormalW;void main(){vec3 n=normalize(vNormalW);vec2 uv=gl_FragCoord.xy/resolution;vec2 offset=n.xz*.018;vec2 suv=clamp(uv+offset,vec2(.002),vec2(.998));vec3 refr=texture2D(sceneTex,suv).rgb;vec3 view=normalize(cameraPosition-vWorld);float fres=pow(1.-abs(dot(view,n)),3.);vec3 reflection=mix(vec3(.10,.30,.28),vec3(.56,.77,.72),pow(max(n.y,0.),8.));vec3 col=mix(refr*vec3(.92,1.02,1.0),reflection,.08+fres*.48);gl_FragColor=vec4(col,.84);}`});const water=mesh(waterGeo,waterMat);water.position.y=waterY;water.renderOrder=10;
const waterline=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([[-3.94,waterY, -1.94],[3.94,waterY,-1.94],[3.94,waterY,1.94],[-3.94,waterY,1.94]].map(p=>new THREE.Vector3(...p))),new THREE.LineBasicMaterial({color:0xa6ded1,transparent:true,opacity:.65}));scene.add(waterline);
// Caustic patches use additive, world-space light mapped onto submerged surfaces.
const causticUniform={time:{value:0}};function addCaustics(material){material.onBeforeCompile=shader=>{shader.uniforms.aquaTime=causticUniform.time;shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vAquaWorld;').replace('#include <worldpos_vertex>','#include <worldpos_vertex>\n#ifdef USE_INSTANCING\nvAquaWorld=(modelMatrix*instanceMatrix*vec4(transformed,1.0)).xyz;\n#else\nvAquaWorld=(modelMatrix*vec4(transformed,1.0)).xyz;\n#endif');shader.fragmentShader=shader.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vAquaWorld; uniform float aquaTime;').replace('#include <dithering_fragment>',`float c=sin(vAquaWorld.x*4.0+sin(vAquaWorld.z*3.0+aquaTime*.5)+aquaTime*.35)*sin(vAquaWorld.z*4.3+sin(vAquaWorld.x*2.2-aquaTime*.4));float light=pow(max(0.0,c),9.0)*.13;gl_FragColor.rgb+=vec3(.54,.82,.68)*light;\n#include <dithering_fragment>`)};}addCaustics(pebble.material);addCaustics(stone);
// Crab, built from separate articulated segments.
function createCrab(){const g=new THREE.Group();g.name='Walking crab';scene.add(g);const shell=mat(0x9f4c36,.48);sphere(g,shell,0,.2,0,.34,.13,.24);sphere(g,mat(0xc97756),0,.27,0,.25,.035,.17);const legs=[];for(let s of [-1,1])for(let i=0;i<4;i++){const pivot=new THREE.Group();pivot.position.set((i-1.5)*.14,.16,s*.16);g.add(pivot);const upper=box(.07,.06,.24,shell,0,0,s*.12,pivot);upper.rotation.x=s*.25;const lower=box(.045,.05,.22,shell,0,-.07,s*.31,pivot);lower.rotation.x=-s*.65;legs.push({pivot,s,i})}for(let s of [-1,1]){tube([[.2,.18,s*.14],[.36,.2,s*.23],[.43,.22,s*.3]],.045,shell,g,8);sphere(g,shell,.47,.22,s*.31,.14,.08,.09);const claw=box(.13,.045,.055,shell,.57,.23,s*.36,g);claw.rotation.y=s*.4;box(.13,.045,.055,shell,.57,.19,s*.27,g);cyl(g,shell,.025,.03,.11,.22,.33,s*.11,8);sphere(g,eyeMat,.22,.39,s*.11,.037,.037,.037,1)}return {g,legs}}const crab=createCrab();
// Coiled snail shells and soft feet; glass snail is oriented against the inner pane.
function createSnail(name,shellColor,pattern){const g=new THREE.Group();g.name=name;scene.add(g);const body=mat(0xa99170,.75),shell=mat(shellColor,.42);sphere(g,body,0,.07,0,.27,.07,.13);sphere(g,body,.21,.13,0,.12,.11,.1);sphere(g,shell,-.04,.23,0,.21,.22,.16);for(const s of [-1,1]){tube([[.23,.17,s*.055],[.3,.28,s*.1],[.34,.31,s*.12]],.012,body,g,8);sphere(g,eyeMat,.34,.31,s*.12,.018,.018,.018,1)}for(const s of [-1,1]){const pts=[];for(let i=0;i<60;i++){let t=i/59,a=t*Math.PI*5,r=.012+t*.18;pts.push([-.04+Math.cos(a)*r,.23+Math.sin(a)*r,s*(.158-.035*t)])}line(pts,new THREE.LineBasicMaterial({color:pattern}),g)}return g}const snailA=createSnail('Amber bottom snail',0xa86b37,0x5d3b28),snailB=createSnail('Olive glass snail',0x9eaa70,0x4d5d36);snailB.rotation.x=-Math.PI/2;snailB.position.set(-2.75,1.05,1.91);
// A few small particles lend depth without clouding the water.
const particleGeo=new THREE.BufferGeometry(),particlePos=new Float32Array(85*3);for(let i=0;i<85;i++){particlePos[i*3]=rand(-3.8,3.8);particlePos[i*3+1]=rand(.4,4.3);particlePos[i*3+2]=rand(-1.8,1.8)}particleGeo.setAttribute('position',new THREE.BufferAttribute(particlePos,3));const particles=new THREE.Points(particleGeo,new THREE.PointsMaterial({color:0xc3ddd1,size:.025,transparent:true,opacity:.3,depthWrite:false}));scene.add(particles);
function wave(x,z,t){return .022*Math.sin(x*2.3+z*1.4+t*1.1)+.015*Math.sin(x*-1.5+z*3.1+t*.78)+.008*Math.sin(x*4-z*2-t*1.5)}
function animateWater(t){const p=waterGeo.attributes.position;for(let i=0;i<p.count;i++){const x=waterBase[i*3],z=waterBase[i*3+2];let y=wave(x,z,t);for(const r of ripples)if(r.age<2){let d=Math.hypot(x-r.x,z-r.z);y+=.012*Math.sin(d*20-r.age*8)*Math.exp(-Math.abs(d-r.age*.42)*7)*(1-r.age/2)}p.setY(i,y)}p.needsUpdate=true;waterGeo.computeVertexNormals();waterMat.uniforms.time.value=t}
function updateFish(dt,t){for(const s of fishStates){s.timer-=dt;if(s.timer<=0||s.g.position.distanceTo(s.target)<.5){s.target.set(rand(-2.9,2.9),rand([2.5,1.7,2.2,2.3][s.i],[3.65,3.15,3.45,3.55][s.i]),rand(-.45,1.1));s.timer=rand(4,9)}let desire=s.target.clone().sub(s.g.position).normalize();for(const other of fishStates){if(other===s)continue;let d=s.g.position.distanceTo(other.g.position);if(d<1.05)desire.add(s.g.position.clone().sub(other.g.position).normalize().multiplyScalar((1.05-d)*1.2))} // Castle and filter steering, including forward look-ahead.
let ahead=s.g.position.clone().add(s.vel.clone().normalize().multiplyScalar(.9));for(const ob of [{x:-.25,z:-1.05,r:1.5,y:2.5},{x:2.9,z:-1.2,r:.65,y:2.5}]){let dx=ahead.x-ob.x,dz=ahead.z-ob.z,d=Math.hypot(dx,dz);if(ahead.y<ob.y&&d<ob.r+.5){desire.x+=dx/(d+.01)*1.5;desire.z+=dz/(d+.01)*1.5}}desire.normalize().multiplyScalar(s.speed*(.85+.15*Math.sin(t*.5+s.phase)));s.vel.lerp(desire,Math.min(1,dt*.6));s.g.position.addScaledVector(s.vel,dt);s.g.position.x=THREE.MathUtils.clamp(s.g.position.x,-3.05,3.05);s.g.position.y=THREE.MathUtils.clamp(s.g.position.y,s.i===2?1.4:.8,s.i===2?3.65:4.05);s.g.position.z=THREE.MathUtils.clamp(s.g.position.z,-1.0,1.2);let angle=Math.atan2(-s.vel.z,s.vel.x);let q=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,angle,THREE.MathUtils.clamp(s.vel.y*.3,-.15,.15)));s.g.quaternion.slerp(q,Math.min(1,dt*2));s.g.position.y+=Math.sin(t*1.2+s.phase)*dt*.015}}
function update(dt,t){updateFish(dt,t);for(const p of pectorals)p.g.rotation.y=p.s*(.5+.28*Math.sin(t*7+p.phase));for(const f of fins){const p=f.o.geometry.attributes.position;for(let i=0;i<p.count;i++){let row=Math.floor(i/(f.cols+1))/f.rows;p.setZ(i,f.base[i*3+2]+Math.sin(t*5-row*3+f.phase)*.045*row)}p.needsUpdate=true;f.o.geometry.computeVertexNormals()}for(const l of animatedLeaves){const p=l.o.geometry.attributes.position;for(let i=0;i<p.count;i++){let row=Math.floor(i/(l.cols+1))/l.rows;p.setX(i,l.base[i*3]+current(l.o.position.x,row*l.length,l.o.position.z,t)*l.stiff*row*row+Math.sin(t*.7+l.phase-row)*.045*l.stiff*row*row)}p.needsUpdate=true;l.o.geometry.computeVertexNormals()}
emit+=dt*15;while(emit>1){emit--;const b=bubbles.find(x=>!x.active);if(b){b.active=true;b.age=0;b.speed=rand(.65,1.05);b.radius=rand(.025,.065);b.o.position.set(2.9+rand(-.06,.06),2.25,-1.2+rand(-.06,.06));b.o.scale.setScalar(b.radius);b.o.visible=true}}for(const b of bubbles)if(b.active){b.age+=dt;b.o.position.y+=dt*b.speed;b.o.position.x+=dt*(Math.sin(b.age*3+b.radius*20)*.035+current(b.o.position.x,b.o.position.y,b.o.position.z,t)*.12);b.o.position.z+=Math.cos(b.age*2+b.radius*50)*dt*.025;if(b.o.position.y>=waterY+wave(b.o.position.x,b.o.position.z,t)){b.active=false;b.o.visible=false;let r=ripples[rippleIndex++%ripples.length];r.age=0;r.x=b.o.position.x;r.z=b.o.position.z;r.o.position.set(r.x,waterY+.015,r.z);r.o.visible=true}}for(const r of ripples)if(r.age<2){r.age+=dt;r.o.scale.setScalar(.06+r.age*.4);r.o.material.opacity=.32*(1-r.age/2);if(r.age>=2)r.o.visible=false}
let cx=-.3+2.1*Math.sin(t*.075);let cz=1.18+.12*Math.sin(t*.16);crab.g.position.set(cx,ground(cx,cz),cz);crab.g.rotation.y=Math.sin(t*.075)>=0?0:Math.PI;for(const l of crab.legs){let a=t*5+l.i*Math.PI+(l.s>0?Math.PI:0);l.pivot.rotation.y=Math.sin(a)*.28;l.pivot.rotation.x=l.s*Math.max(0,Math.sin(a))*.35}let sx=-2+1.15*Math.sin(t*.025);snailA.position.set(sx,ground(sx,1.5),1.5);snailA.rotation.y=Math.cos(t*.025)>0?0:Math.PI;snailB.position.y=1.05+.25*Math.sin(t*.018);causticUniform.time.value=t;particles.rotation.y=Math.sin(t*.025)*.012;animateWater(t)}
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.fov=w<h?THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(THREE.MathUtils.degToRad(36)/2)/(w/h))):36;camera.updateProjectionMatrix();renderer.setSize(w,h);const size=renderer.getDrawingBufferSize(new THREE.Vector2());target.setSize(Math.max(1,Math.floor(size.x*.7)),Math.max(1,Math.floor(size.y*.7)));waterMat.uniforms.resolution.value.set(size.x,size.y)}window.addEventListener('resize',resize);resize();
document.getElementById('reset').addEventListener('click',()=>{camera.position.set(10,7.1,13.8);controls.target.set(0,2.05,0);controls.update()});document.getElementById('pause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume':'Pause';e.currentTarget.setAttribute('aria-label',paused?'Resume animation':'Pause animation')});
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(!paused){time+=dt;update(dt,time)}controls.update();water.visible=false;panes.visible=false;renderer.setRenderTarget(target);renderer.render(scene,camera);renderer.setRenderTarget(null);water.visible=true;panes.visible=true;renderer.render(scene,camera)}frame();document.getElementById('loading').classList.add('done');
